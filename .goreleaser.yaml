# GoReleaser configuration for paruz
version: 2

before:
  hooks:
    - go mod tidy

builds:
  - main: ./cmd/paruz/main.go
    binary: paruz
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    ldflags:
      - -s -w -X main.version={{ .Version }}
    goos:
      - linux
    goarch:
      - amd64
      - arm64
      - "386"
      - arm
    goarm:
      - 6
      - 7

archives:
  - formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else if eq .Arch "386" }}i386
      {{- else if eq .Arch "arm" }}v{{ .Arm }}
      {{- else }}{{ .Arch }}{{ end }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: 'checksums.txt'

aurs:
  - name: paruz
    homepage: "https://github.com/Vyogami/paruz"
    description: "A terminal UI (TUI) for the paru AUR helper"
    maintainers:
      - 'vyogami <shiv.05cs@gmail.com>'
    license: "MIT"
    private_key: '{{ .Env.AUR_KEY }}'
    git_url: 'ssh://aur@aur.archlinux.org/paruz.git'
    # Skip publishing on snapshots and pre-releases (e.g. v*-alpha).
    skip_upload: auto
    commit_author:
      name: vyogami
      email: shiv.05cs@gmail.com
    commit_msg_template: "Update to {{ .Tag }}"
    depends:
      - paru
      - pacman
    package: |-
      install -Dm755 "./paruz" "${pkgdir}/usr/bin/paruz"
      install -Dm644 "./LICENSE" "${pkgdir}/usr/share/licenses/paruz/LICENSE"

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - '^docs:'
      - '^test:'
